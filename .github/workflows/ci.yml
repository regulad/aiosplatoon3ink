name: CI

# Lint, types and tests on every push to main and every pull request. Once a week, and on demand, the live tests check
# the models against splatoon3.ink's feeds as they are now, to catch a change in their shape. They run nowhere else,
# since splatoon3.ink asks clients not to fetch more than once an hour.
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
      # Poetry at the version pyproject.toml pins.
      - name: Install Poetry
        run: >-
          pip install "poetry==$(python -c 'import tomllib;
          print(tomllib.load(open("pyproject.toml", "rb"))["tool"]["poetry"]["group"]["dev"]["dependencies"]["poetry"])')"
      - name: Install dependencies
        run: poetry install --no-interaction
      - name: Run the pre-commit hooks
        run: poetry run pre-commit run --all-files --show-diff-on-failure

  type:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
      - name: Install Poetry
        run: >-
          pip install "poetry==$(python -c 'import tomllib;
          print(tomllib.load(open("pyproject.toml", "rb"))["tool"]["poetry"]["group"]["dev"]["dependencies"]["poetry"])')"
      - name: Install dependencies
        run: poetry install --with type --no-interaction
      - name: Run mypy
        run: poetry run mypy src tests

  test:
    if: github.event_name != 'schedule'
    name: test (${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14", "3.15"]
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install Poetry
        run: >-
          pip install "poetry==$(python -c 'import tomllib;
          print(tomllib.load(open("pyproject.toml", "rb"))["tool"]["poetry"]["group"]["dev"]["dependencies"]["poetry"])')"
      - name: Install dependencies
        run: poetry install --no-interaction
      - name: Run the tests
        run: poetry run pytest

  live:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
      - name: Install Poetry
        run: >-
          pip install "poetry==$(python -c 'import tomllib;
          print(tomllib.load(open("pyproject.toml", "rb"))["tool"]["poetry"]["group"]["dev"]["dependencies"]["poetry"])')"
      - name: Install dependencies
        run: poetry install --no-interaction
      - name: Run the live tests
        run: poetry run pytest -m live
